# CI quality gate: the full test suite (parser + engine, incl. the conformance corpora
# from the submodules; the yed editor + server vitest suites) and the server typecheck,
# on push / PR to main. GitHub counterpart of
# .forgejo/workflows/ci.yml. Node 22 is required (native .ts type-stripping + the built-in
# node:sqlite the engine runs on). A second job runs the JetBrains plugin's Gradle tests —
# its Kotlin lexer + pointer navigation reimplement the parser, so this gate catches drift
# when the yamlover/pointer grammar changes (see tools/jetbrains-plugin).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Real GitHub only — skipped on the Forgejo mirror, which runs the .forgejo copy.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    env:
      # npm's HTTP agent only drains its queue when a connection SUCCEEDS, so one flaky
      # registry fetch strands every request queued behind the 15-socket default and the
      # install dies with "Exit handler never called!" (npm/cli#9386). Above the dependency
      # count nothing queues, so a failed fetch reports and retries instead of hanging.
      npm_config_maxsockets: 1000
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # the JSON/JSON5/YAML conformance corpora (tests skip them if absent)

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # One root `npm ci` installs every workspace (parser, engine, yed, server) — the nested
      # lockfiles are gone since the workspaces migration, so `npm ci --prefix …` cannot work.
      - name: Install (npm workspaces)
        run: npm ci

      - name: Tests (parser + engine)
        run: npm test

      - name: Typecheck (server)
        run: npm run typecheck

      - name: Tests (yed — vitest)
        run: npm --prefix tools/yed test

      - name: Tests (server — vitest)
        run: npm --prefix tools/server test

  jetbrains-plugin:
    # Real GitHub only — skipped on the Forgejo mirror, which runs the .forgejo copy.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21 runs Gradle; the jvmToolchain(17) target is auto-provisioned via the
      # foojay resolver (settings.gradle.kts). The IntelliJ Platform SDK is fetched once.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (jetbrains plugin — lexer + pointer navigation)
        working-directory: tools/jetbrains-plugin
        run: ./gradlew --no-daemon test
