<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">yamlover</title>
  <desc id="desc">The yo mark, small cut, on a cobalt tile.</desc>
  <!-- The SMALL CUT of the mark: the three branch nodes are dropped and the stroke thickened,
       because below ~32px the r=8 dots swallow the arms they sit on and the y turns to mush.
       Round caps still terminate the branches, so the silhouette stays the mark's. The tile is
       what makes it legible as a favicon: a line mark this fine all but vanishes at 16px. -->
  <rect width="96" height="96" rx="21" fill="#246BFD"/>
  <g transform="translate(9.6 9.6) scale(0.8)">
    <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 15 43 43 71 15M43 43 15 71"/>
      <circle cx="59.970563" cy="59.970563" r="24"/>
    </g>
    <circle cx="59.970563" cy="59.970563" r="5" fill="#fff"/>
  </g>
</svg>
