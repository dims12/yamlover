<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* 800x800 — YouTube crops the profile picture to a circle, so the cobalt ground runs
         edge to edge (no rounded tile: its corners would be cropped away anyway) and the mark
         sits well inside the circle's inscribed square. */
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 800px; height: 800px; }
      body { background: #246bfd; display: grid; place-items: center; }
      svg { width: 520px; height: 520px; display: block; }
    </style>
  </head>
  <body>
    <!-- viewBox 0 0 96 96: the artwork spans 7..89 in both axes (the `o` circle's stroke is the
         far edge, the node dots the near one), so this leaves an even margin and clips nothing. -->
    <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
      <g>
        <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 15 43 43 71 15M43 43 15 71" />
          <circle cx="59.970563" cy="59.970563" r="24" />
        </g>
        <g fill="#fff">
          <circle cx="15" cy="15" r="8" />
          <circle cx="71" cy="15" r="8" />
          <circle cx="15" cy="71" r="8" />
          <circle cx="59.970563" cy="59.970563" r="8" />
        </g>
      </g>
    </svg>
  </body>
</html>
