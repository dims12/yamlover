      <path d="M15 15 43 43 71 15M43 43 15 71" stroke="#CED0D6"/>
      <circle cx="59.970563" cy="59.970563" r="24" stroke="#548AF7"/>
    </g>
    <circle cx="59.970563" cy="59.970563" r="5" fill="#548AF7"/>
  </g>
</svg>
