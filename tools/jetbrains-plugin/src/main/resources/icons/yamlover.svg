<!-- The yamlover mark (brand/yo-mark.svg), small cut: at 16px the three branch nodes swallow the
     arms they sit on, so they are dropped and the stroke thickened; the round caps still terminate
     the branches. Authored on the brand's own 96 grid — the translate only centres the ink, which
     the thicker stroke pushes down-right of the box centre. `yamlover_dark.svg` is the same
     drawing in the dark palette; IconLoader picks between them. -->
