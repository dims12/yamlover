    <g fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 15 43 43 71 15M43 43 15 71" stroke="#111827"/>
      <circle cx="59.970563" cy="59.970563" r="24" stroke="#246BFD"/>
    </g>
    <circle cx="59.970563" cy="59.970563" r="5" fill="#246BFD"/>
  </g>
</svg>
