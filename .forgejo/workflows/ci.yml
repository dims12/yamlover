# CI quality gate: the full test suite (parser + engine, incl. the conformance corpora
# from the submodules) and the server typecheck, on every push / PR. Node 22 is required
# (native .ts type-stripping + the built-in node:sqlite the engine runs on). A second job
# runs the JetBrains plugin's Gradle tests — its Kotlin lexer + pointer navigation
# reimplement the parser, so this gate catches drift when the grammar changes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # the JSON/JSON5/YAML conformance corpora (tests skip them if absent)

      # One root `npm ci` installs every workspace (parser, engine, server) — the nested
      # lockfiles are gone since the workspaces migration, so `npm ci --prefix …` cannot work.
      - name: Install (npm workspaces)
        run: npm ci

      - name: Tests (parser + engine)
        run: npm test

      - name: Typecheck (server)
        run: npm run typecheck

      - name: Tests (server — vitest)
        run: npm --prefix tools/server test

  jetbrains-plugin:
    runs-on: docker
    container:
      image: eclipse-temurin:21-jdk
    steps:
      - uses: actions/checkout@v4

      # JDK 21 runs Gradle; the jvmToolchain(17) target is auto-provisioned via the
      # foojay resolver (settings.gradle.kts). The IntelliJ Platform SDK is fetched once.
      - name: Tests (jetbrains plugin — lexer + pointer navigation)
        working-directory: tools/jetbrains-plugin
        run: ./gradlew --no-daemon test
